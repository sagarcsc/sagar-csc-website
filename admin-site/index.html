<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAGAR CSC Admin</title><style>body{font-family:system-ui;background:#f4f7fc;color:#15213a;margin:0;padding:18px}.panel{max-width:800px;margin:25px auto;background:white;padding:22px;border-radius:16px;box-shadow:0 5px 24px #10245412}input,textarea,button{font:inherit;padding:12px;border-radius:10px;margin:6px 0;width:100%;box-sizing:border-box}button{background:#245bd1;color:white;border:0;font-weight:bold}.hidden{display:none}.item{padding:14px;margin:12px 0;background:#eef3fb;border-radius:12px}</style></head><body><div class="panel"><h1>SAGAR CSC Admin</h1><div id="login"><label>Admin PIN</label><input id="pin" type="password" inputmode="numeric" placeholder="Enter PIN"><button id="unlock">Login</button><p id="error"></p></div><div id="manager" class="hidden"><button id="lock">Lock</button><button id="change">Change PIN</button><h2>Service manager</h2><form id="add"><input id="name" required placeholder="Service name"><textarea id="desc" placeholder="Description"></textarea><input id="price" type="number" min="0" step="1" required placeholder="Service charge in ₹ (0 if not set)"><button>Add service</button></form><div id="list"></div><p>Note: local browser storage only, not a central database.</p></div></div><script src="admin.js?v=charges1"></script></body></html>
